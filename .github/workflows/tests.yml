name: Tests

# Holds NO credentials, deliberately. Every assertion runs against a throwaway
# PostgreSQL container created inside the runner, so this workflow is safe on a
# pull request from a fork: there is nothing here to steal, which is why it
# carries none of the `if: head.repo == github.repository` guard the dry-run
# workflow needs. If a step ever needs a secret, it belongs in its own
# workflow, not in this one.
#
# This is what turns the "Enforced by" column of CLAUDE.md §2 into something
# real rather than aspirational: R1, R11 and R12 are asserted on every change.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database:
    # Pinned rather than ubuntu-latest: the same commit must not change
    # behaviour because GitHub moved the label to a new image.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # The same script a developer runs locally, unmodified, so CI and a
      # working copy cannot drift apart. PostgreSQL 15 deliberately: the floor
      # the migrations claim to support.
      #
      # --mutate additionally removes each control in turn and requires that
      # exactly its own suite then breaks. A control that can be deleted
      # without any test noticing is not a control.
      - name: Database suites and mutation verification
        run: bash supabase/tests/run.sh --mutate

  crypto:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Pinned to the version the suite is proven against. The tests are
          # WebCrypto-only and run unchanged on Deno, which is what the Edge
          # Functions will use.
          node-version: 24.15.0

      - name: Core unit tests (crypto, providers)
        run: >
          node --experimental-strip-types --test
          packages/core/crypto/envelope.test.ts
          packages/core/providers/providers.test.ts
          packages/core/content/content.test.ts
          packages/core/content/generate.test.ts

  functions:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.8        # pinned: the version the handler type-checks against

      # The generate handler has no runtime unit test (its logic is in
      # packages/core, which is tested on Node). `deno check` is its guard: it
      # resolves the real imports, including deno-postgres, and type-checks the
      # whole graph, so a broken import or type fails CI before a deploy.
      - name: Type-check the edge functions
        run: deno check supabase/functions/generate/index.ts supabase/functions/write-credential/index.ts

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      # Type-checks and builds the SPA. It holds no secret and reads no network
      # at build time, so it needs no credentials. A broken type or import fails
      # CI before a deploy.
      - run: npm ci
      - run: npm run build
