name: DB dry-run

# Read-only. Shows what `db push` WOULD apply and never applies it.
# There is deliberately no write-capable database command anywhere in this file.
#
# Why `pull_request` and not `pull_request_target`: the latter runs the BASE
# repository's workflow with secrets available while checking out the PR head,
# which hands fork code access to our credentials. This repository is public,
# so that would be a straightforward credential-theft path. Never use it here.

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/db-dry-run.yml'

permissions:
  contents: read

concurrency:
  group: db-dry-run-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dry-run:
    # Trusted, same-repository branches only. GitHub already withholds secrets
    # from fork pull requests, but failing fast here makes the intent explicit
    # rather than leaving a confusing half-configured run.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          # Pinned, not `latest`: a CLI release must never silently change
          # migration behaviour between two runs of the same commit.
          version: 2.121.0

      - name: Verify the target project before linking
        env:
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          if [ -z "${PROJECT_REF:-}" ]; then
            echo "::error::Repository variable SUPABASE_PROJECT_REF is not set."
            exit 1
          fi
          # Fingerprint only. The full ref is never printed, because this
          # repository is public and its logs are world-readable.
          echo "Target fingerprint: ${PROJECT_REF:0:4}...${PROJECT_REF: -4}"

      - name: Link to the development project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: supabase link --project-ref "$PROJECT_REF"

      - name: Dry run — read-only, applies nothing
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --dry-run
